version: v0.4
project:
  name: "SequenceNicolas: powers of a prime in the image of summatory valuation functions"
  description: "Lean 4 formalization of the paper 'Powers of a Prime in the Image of Summatory Valuation Functions', on the question of Nicolas about the powers of 2 in the image of c(n) = sum_{k=1}^{n} 2^{v_2(k)}. It proves the recurrences and the binary formula for c, the equivalence of Theorem thm:equiv, the greedy lemma, the leading term and the recursion on states with its algorithm, the explicit members and non-members, the one-step classification, the families of Nicolas and their counting, the lower bounds for the counting functions A(x) and B(x) (Theorems thm:counting and thm:counting2), the forest of successful states, the bottom-up recursion and the symmetry, the further families of Theorem thm:symfamilies, and the analogue for an arbitrary prime p (Lemma lem:cp, Proposition prop:Fp, Theorems thm:primes, thm:primestep, thm:primefamilies, thm:immediate, thm:primebottomup and Proposition prop:primezero). Everything is proved from Mathlib. The computations of Section sec:experiments and Proposition prop:Ncount (2) are not formalized."
  authors:
    - name: "Frank Vega"
      orcid: "0000-0001-8210-4126"
      email: "vega.frank@gmail.com"
      affiliation: "Information Physics Institute"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Frank Vega"
      github: "frankvegadelgado"
      email: "vega.frank@gmail.com"

classification:
  arxiv: ["math.NT"]
  msc: ["11A63", "11A25", "11B83", "11N37"]

paper: paper.tex
lean_toolchain_file: lean-toolchain

sources:
  - title: "Powers of a Prime in the Image of Summatory Valuation Functions"
    type: manuscript
    relationship: formalizes
    authors: ["Frank Vega"]

automation:
  methods:
    - method: manual
      notes: "The author states the theorems, writes and edits the paper (with the AI assistance described below), and reviews the formal statements in Challenge.lean."
    - method: other
      notes: "Claude (Anthropic) assisted in deriving the proofs, in writing the Lean 4 formalization and in preparing the manuscript; the author reviewed and edited the AI-assisted content. The Lean proofs are checked by the Lean kernel via lake build, and lake comparator verifies Solution.lean against Challenge.lean in GitHub Actions. The fuller account is in the Acknowledgments of the manuscript (doc/paper.tex)."

review:
  status: "self-assessed"
  notes: "Checked by the author alone, not independently reviewed. The author reviewed the formal statements in Challenge.lean, the manuscript and the AI-assisted content, as the manuscript states. The mechanical basis is the Lean kernel check (lake build) and the Comparator run of Solution.lean against Challenge.lean in GitHub Actions."

repository:
  role: substantive-development

related_formalizations: []

main_result:
  name: equiv_repr
  paper_theorem: thm:equiv
  statement: For a >= 0, 2^a is a value of c(n) = sum_{k=1}^{n} 2^{v_2(k)} if and only if 2^(a+3) = sum_{j in T} j 2^j for a finite set T of positive integers.
  lean_modules: [SequenceNicolas.Core, SequenceNicolas.Recursion, SequenceNicolas.Families, SequenceNicolas.States, SequenceNicolas.Forest, SequenceNicolas.Roots, SequenceNicolas.SymFamilies, SequenceNicolas.NicolasCount, SequenceNicolas.CountBase, SequenceNicolas.Counting, SequenceNicolas.CountingA, SequenceNicolas.CountingB, SequenceNicolas.CountingC, SequenceNicolas.CountingD, SequenceNicolas.CountingReal, SequenceNicolas.PrimesBase, SequenceNicolas.PrimesRep, SequenceNicolas.PrimesStep, SequenceNicolas.PrimesFamilies, SequenceNicolas.PrimesImmediate, SequenceNicolas.PrimesBottomUp, SequenceNicolas.PrimesFp, SequenceNicolas.PrimesCount, SequenceNicolas.PrimesCountReal]
  cited_not_formalized: []

modules:
  - name: SequenceNicolas.Core
    path: SequenceNicolas/Core.lean
    status: formalized
    notes: "The function c n = sum_{k=1}^{n} 2^{v_2(k)} (padicValNat 2); the recurrences; Lemma lem:cformula; Theorem thm:equiv; Lemma lem:sum; Theorem thm:leading (1); Theorem thm:members."
  - name: SequenceNicolas.Recursion
    path: SequenceNicolas/Recursion.lean
    status: formalized
    notes: "Lemma lem:greedy; the functions hfun and beta; Theorem thm:leading (1), (2), (3) and its last statement; Theorem thm:step; Algorithm alg:membership and Corollary cor:algo; Lemma lem:least."
  - name: SequenceNicolas.Families
    path: SequenceNicolas/Families.lean
    status: formalized
    notes: "Lemma lem:order; Theorem thm:nonmembers; Theorem thm:firststep; Proposition prop:nicolasfamilies."
  - name: SequenceNicolas.States
    path: SequenceNicolas/States.lean
    status: formalized
    notes: "Proposition prop:symmetry; Theorem thm:forest (2), (3) without the counting identities, and (4); Theorem thm:bottomup."
  - name: SequenceNicolas.Forest
    path: SequenceNicolas/Forest.lean
    status: formalized
    notes: "Proposition prop:Ncount (1); N(2k+1) = N(2k) of Proposition prop:Npairs; Theorem thm:forest (1), (2) and the counting identities of (3)."
  - name: SequenceNicolas.Roots
    path: SequenceNicolas/Roots.lean
    status: formalized
    notes: "4 divides N(J) of Proposition prop:Npairs; the sum of F(J) of Theorem thm:forest (1); Proposition prop:roots."
  - name: SequenceNicolas.SymFamilies
    path: SequenceNicolas/SymFamilies.lean
    status: formalized
    notes: "Theorem thm:symfamilies (1), (2), (3)."
  - name: SequenceNicolas.NicolasCount
    path: SequenceNicolas/NicolasCount.lean
    status: formalized
    notes: "Proposition prop:nicolascount."
  - name: SequenceNicolas.CountBase
    path: SequenceNicolas/CountBase.lean
    status: formalized
    notes: "The constants E, C1, C2 and the series estimates used in Theorems thm:counting and thm:counting2."
  - name: SequenceNicolas.Counting
    path: SequenceNicolas/Counting.lean
    status: formalized
    notes: "The counting functions A and B for natural arguments and the index sets of the families of Theorems thm:members and thm:nonmembers."
  - name: SequenceNicolas.CountingA
    path: SequenceNicolas/CountingA.lean
    status: formalized
    notes: "Theorem thm:counting, the bound for A."
  - name: SequenceNicolas.CountingB
    path: SequenceNicolas/CountingB.lean
    status: formalized
    notes: "Theorem thm:counting, the bound for B."
  - name: SequenceNicolas.CountingC
    path: SequenceNicolas/CountingC.lean
    status: formalized
    notes: "Theorem thm:counting2, the combinatorial side."
  - name: SequenceNicolas.CountingD
    path: SequenceNicolas/CountingD.lean
    status: formalized
    notes: "Theorem thm:counting2, the explicit bounds."
  - name: SequenceNicolas.CountingReal
    path: SequenceNicolas/CountingReal.lean
    status: formalized
    notes: "The bounds of Theorems thm:counting and thm:counting2 for a real argument x >= 16."
  - name: SequenceNicolas.PrimesBase
    path: SequenceNicolas/PrimesBase.lean
    status: formalized
    notes: "Lemma lem:cp."
  - name: SequenceNicolas.PrimesRep
    path: SequenceNicolas/PrimesRep.lean
    status: formalized
    notes: "Theorem thm:primes."
  - name: SequenceNicolas.PrimesStep
    path: SequenceNicolas/PrimesStep.lean
    status: formalized
    notes: "Theorem thm:primestep."
  - name: SequenceNicolas.PrimesFamilies
    path: SequenceNicolas/PrimesFamilies.lean
    status: formalized
    notes: "Theorem thm:primefamilies (1), (2), (3) and Proposition prop:primezero."
  - name: SequenceNicolas.PrimesImmediate
    path: SequenceNicolas/PrimesImmediate.lean
    status: formalized
    notes: "Theorem thm:immediate."
  - name: SequenceNicolas.PrimesBottomUp
    path: SequenceNicolas/PrimesBottomUp.lean
    status: formalized
    notes: "Theorem thm:primebottomup."
  - name: SequenceNicolas.PrimesFp
    path: SequenceNicolas/PrimesFp.lean
    status: formalized
    notes: "Proposition prop:Fp."
  - name: SequenceNicolas.PrimesCount
    path: SequenceNicolas/PrimesCount.lean
